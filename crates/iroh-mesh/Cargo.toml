[package]
name = "iroh-mesh"
version = "0.0.5"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/prabirshrestha/imesh"
description = "Machines that talk over iroh, with a signed membership roster and no control plane"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
data-encoding = "2.11.1"
futures-util = "0.3.34"
hex = "0.4.3"
iroh = "1.4.1"
iroh-dns = "1.4.1"
iroh-mdns-address-lookup = "0.6.1"
iroh-relay = { version = "1.4.1", features = ["server"] }
n0-error = "1.0.3"
n0-future = "0.3.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
gethostname = "1.1.0"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
rand = "0.10.3"
