[package]
name = "iroh-mesh"
version = "0.0.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/prabirshrestha/imesh"
description = "Machines that talk over iroh, with a replicated SQLite database and no control plane"

[dependencies]
bytes = "1.12.1"
anyhow = "1.0.104"
data-encoding = "2"
futures-util = "0.3.34"
hex = "0.4.3"
iroh = "1.2"
iroh-dns = "1.3"
iroh-mdns-address-lookup = "0.5"
iroh-relay = { version = "1.2", features = ["server"] }
n0-error = "1"
n0-future = "0.3"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
corro-agent = { git = "https://github.com/superfly/corrosion", rev = "ef243dd16dc0878122c22edad834a6240abbe4c1" }
corro-types = { git = "https://github.com/superfly/corrosion", rev = "ef243dd16dc0878122c22edad834a6240abbe4c1" }
tripwire = { git = "https://github.com/superfly/corrosion", rev = "ef243dd16dc0878122c22edad834a6240abbe4c1" }
sqlite3-parser = "0.12"
fallible-iterator = "0.3"
rusqlite = { version = "0.38", features = ["bundled", "hooks"] }
camino = "1"
foca = "0.19"
gethostname = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
