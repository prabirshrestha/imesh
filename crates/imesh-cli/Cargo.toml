[package]
name = "imesh-cli"
version = "0.1.0"
edition = "2024"
description = "The imesh command: install machines over SSH, manage the cluster, run the daemon"

[lib]
name = "imesh_cli"

[[bin]]
name = "imesh"
path = "src/main.rs"

[dependencies]
imesh = { path = "../imesh" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
data-encoding = "2"
dirs = "7.0.0"
hex = "0.4.3"
iroh = "1.2"
iroh-tickets = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-service = "0.8"
