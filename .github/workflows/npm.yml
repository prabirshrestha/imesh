name: npm

# Push a tag like v0.1.0 to build all binaries and publish them to npm.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, npm: darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, npm: darwin-x64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, npm: linux-x64, cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, npm: linux-arm64, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, npm: win32-x64 }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, npm: win32-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Apply the corrosion patch
        shell: bash
        run: git -C vendor/corrosion apply ../corrosion.patch
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then tool=cross; else tool=cargo; fi
          $tool build --release --locked -p imesh-cli --target ${{ matrix.target }}
          mkdir -p dist/${{ matrix.npm }}
          for f in imesh imesh.exe; do
            if [ -f target/${{ matrix.target }}/release/$f ]; then
              cp target/${{ matrix.target }}/release/$f dist/${{ matrix.npm }}/
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm }}
          path: dist/${{ matrix.npm }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Make packages
        run: node npm/scripts/pack.mjs "${GITHUB_REF_NAME#v}" dist out
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for d in out/imesh-*; do npm publish "$d" --access public; done
          npm publish out/imesh --access public
