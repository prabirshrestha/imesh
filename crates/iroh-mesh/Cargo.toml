[package]
name = "iroh-mesh"
version = "0.0.4"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/prabirshrestha/imesh"
description = "Machines that talk over iroh, with a signed membership roster and no control plane"

[dependencies]
anyhow = "1.0.104"
blake3 = "1"
data-encoding = "2"
futures-util = "0.3.34"
hex = "0.4.3"
iroh = "1.2"
iroh-dns = "1.3"
iroh-mdns-address-lookup = "0.5"
iroh-relay = { version = "1.2", features = ["server"] }
n0-error = "1"
n0-future = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
gethostname = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
rand = "0.9"
