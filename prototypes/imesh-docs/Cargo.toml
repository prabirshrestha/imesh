[package]
name = "imesh-docs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "imesh"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
data-encoding = "2"
dirs = "7.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
iroh = "1.2"
iroh-dns = "1.3"
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
iroh-docs = { version = "0.101", default-features = false, features = ["fs-store"] }
iroh-gossip = "0.101"
iroh-relay = { version = "1.2", features = ["server"] }
iroh-tickets = "1"
n0-error = "1"
n0-future = "0.3"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
